name: CI Pipeline

on:
  push:
    branches: [ releases ]
  pull_request:
    branches: [ releases ]

# Los permisos se declararán en la etapa final, cuando se proponga la implementación del merge.
# permissions:
#  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt     

      - name: Ejecutar pruebas
        env:
          MI_CLAVE_SECRETA: ${{ secrets.MI_CLAVE_SECRETA }}
        run: |
          pytest tests/